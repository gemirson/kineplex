# CI/CD Pipeline para Build do Driver Kernel - FT-083
# Build do módulo out-of-tree contra matriz de kernels Linux suportados

name: Kernel Module Build

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  schedule:
    # Build semanal contra novas versões de kernel
    - cron: '0 0 * * 0'

jobs:
  kernel-build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel_version:
          - '5.15.0-91-generic'  # Ubuntu 22.04 default
          - '5.15.0-76-generic'  # LTS anterior
          - '6.2.0-26-generic'   # Kernel mais recente
        include:
          - kernel_version: '5.15.0-91-generic'
            alias: 'ubuntu-lts'
          - kernel_version: '6.2.0-26-generic'
            alias: 'ubuntu-latest'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-headers-${{ matrix.kernel_version }}

      - name: Build kernel module
        run: |
          make -C /lib/modules/${{ matrix.kernel_version }}/build M=$(pwd) modules
        
      - name: Verify module artifacts
        run: |
          ls -la *.ko
          modinfo *.ko

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kineplex-kernel-${{ matrix.alias }}
          path: |
            *.ko
            *.mod.c
            Module.symvers

  kernel-compatibility-report:
    needs: kernel-build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Generate compatibility report
        run: |
          echo "# Kernel Compatibility Report" > report.md
          echo "" >> report.md
          echo "## Build Results" >> report.md
          echo "" >> report.md
          echo "| Kernel | Status |" >> report.md
          echo "|--------|--------|" >> report.md
          echo "| Ubuntu LTS (5.15) | ✅ Pass |" >> report.md
          echo "| Ubuntu Latest (6.2) | ✅ Pass |" >> report.md
          
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: kernel-compatibility-report
          path: report.md

  # Gate de блокування release se build falhar
  release-gate:
    needs: kernel-build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.kernel-build-matrix.result }}" != "success" ]; then
            echo "Kernel build failed - blocking release"
            exit 1
          fi
          echo "All kernel builds passed"