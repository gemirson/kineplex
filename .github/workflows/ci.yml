name: KinePlex CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Build & Test (Rust stable)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build all crates
        run: cargo build --all 2>&1

      - name: Run unit tests (all crates)
        run: cargo test --all 2>&1

      - name: FT-050 — Geometry stress tests
        run: cargo test -p kineplex-core --test geometry_stress 2>&1

      - name: FT-058 — Zero-alloc geometry tests
        run: cargo test -p kineplex-core --test geometry_allocations 2>&1

      - name: FT-060 — Geometry deformation stress tests
        run: cargo test -p kineplex-core --test geometry_deformation_stress 2>&1

  bench-dry-run:
    name: Benchmark dry-run (Criterion --test)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Dry-run geometry_stability benchmark
        run: cargo bench -p kineplex-core --bench geometry_stability -- --test

      - name: Dry-run geodesic_lookup benchmark
        run: cargo bench -p kineplex-core --bench geodesic_lookup -- --test

  e2e-harness-check:
    name: E2E harness syntax check (Python)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install polars pyarrow

      - name: Verify run_e2e.py is importable / syntactically valid
        run: python3 -m py_compile bench/e2e/run_e2e.py
