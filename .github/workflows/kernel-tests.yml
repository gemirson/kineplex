# Validações executáveis do driver e XDP.
# KUnit/insmod precisam de uma VM Linux com headers e permissões de kernel.

name: Kernel Driver Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate FT-093..FT-096 source contracts
        run: tests/kernel/static_validation.sh

  module-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm kmod util-linux linux-headers-$(uname -r)

      - name: Build module against runner kernel
        run: make -C kineplex-kernel KDIR=/lib/modules/$(uname -r)/build

      - name: Build BPF object
        run: make -C tools bpf

  loader-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install libbpf build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libbpf-dev pkg-config

      - name: Compile userspace lifecycle loader
        run: make -C tools loader

  # This job is intentionally manual: loading an LKM and attaching XDP changes
  # the runner network namespace and requires a kernel with a suitable NIC.
  privileged-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm kmod util-linux linux-headers-$(uname -r)

      - name: Build artifacts
        run: |
          make -C kineplex-kernel KDIR=/lib/modules/$(uname -r)/build
          make -C tools bpf

      - name: Load module on an explicitly selected NIC
        env:
          KINEPLEX_NIC: ${{ vars.KINEPLEX_NIC || 'eth0' }}
        run: |
          sudo insmod kineplex-kernel/kineplex_geo.ko nic_ifname="$KINEPLEX_NIC"
          test -c /dev/kinegeo

      - name: Run unprivileged capability test
        run: |
          sudo chown root:root tests/kernel/capability_smoke.sh
          setpriv --reuid=nobody --regid=nogroup --clear-groups \
            tests/kernel/capability_smoke.sh /dev/kinegeo

      - name: Unload module
        if: always()
        run: sudo rmmod kineplex_geo

  test-summary:
    if: always()
    needs: [static-contract, module-build, loader-build, privileged-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Publish test summary and fail closed
        run: |
          {
            echo '## Kernel test summary'
            echo
            echo '| Suite | Result |'
            echo '|---|---|'
            echo '| Static contract | ${{ needs.static-contract.result }} |'
            echo '| Module build | ${{ needs.module-build.result }} |'
            echo '| libbpf loader build | ${{ needs.loader-build.result }} |'
            echo '| Privileged integration | ${{ needs.privileged-integration.result }} |'
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.static-contract.result }}" = success
          test "${{ needs.module-build.result }}" = success
          test "${{ needs.loader-build.result }}" = success
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            test "${{ needs.privileged-integration.result }}" = success
          fi
